<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolución del entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#F6F7F9;--card:#FFFFFF;--line:#E3E6EA;--soft:#EEF0F3;--ink:#15181D;--ink2:#3A414B;--muted:#5A626E;--blue:#1F5FBF;--blue-ink:#174A94;--blue-tint:#E6EEFA;--orange:#C2410C;--grey-bar:#6B7482;--track:#E9ECF0}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;line-height:1.45}
button{font-family:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.page{max-width:1080px;margin:0 auto;padding:40px 16px 64px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:18px;font-weight:600}
.sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px}
nav{display:flex;flex-wrap:wrap;background:var(--track);border-radius:10px;padding:4px;gap:4px}
nav button{min-height:44px;padding:0 18px;border:none;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink2);background:transparent;cursor:pointer}
nav button[aria-selected=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,24,29,.08)}
.stack{display:flex;flex-direction:column;gap:28px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:15px}
.pill{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#ECEFF2;color:var(--ink2)}
.pill.on{background:var(--blue-tint);color:var(--blue-ink)}
.bar{display:flex;flex-direction:column;gap:8px}
.track{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:6px;background:var(--blue)}
.small{margin:0;font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi span:first-child{font-size:13px;color:var(--muted)}
.kpi span:last-child{font-size:28px;font-weight:700;letter-spacing:-.01em}
section.card{padding:28px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw-line{width:14px;height:2px;background:var(--blue)}
.sw-band{width:14px;height:10px;background:var(--blue);opacity:.2}
.sw-dot{width:10px;height:10px;border-radius:50%;background:var(--orange)}
.sw-dash{width:14px;height:0;border-top:2px dashed var(--muted)}
svg{width:100%;height:auto;display:block}
svg text{font-family:inherit}
.empty{margin:0;padding:24px 0;font-size:14px;color:var(--muted)}
section.card.hand{padding:0;gap:0}
.hand>button{width:100%;min-height:56px;padding:0 28px;background:none;border:none;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.hand>button span+span{font-size:14px;font-weight:500;color:var(--muted)}
.hand-body{padding:0 28px 24px;display:flex;flex-direction:column}
.hand-body>p{margin:0 0 12px;font-size:14px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 0;border-top:1px solid var(--soft);font-size:14px}
.row .who{width:120px;color:var(--muted)}
.row .act{flex:1;min-width:180px;font-weight:600}
.row .why{color:var(--muted)}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pair{border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.pair p{margin:0;font-size:14px;font-weight:600}
.line{display:flex;align-items:center;gap:12px}
.line .lbl{width:150px;font-size:13px;color:var(--muted)}
.line .rail{flex:1;height:10px;background:var(--soft);border-radius:6px}
.line .rail div{height:10px;border-radius:6px}
.line .val{width:64px;text-align:right;font-size:14px;font-weight:600}
[hidden]{display:none!important}
@media(max-width:640px){
 .page{padding:24px 16px 48px;gap:20px}
 nav{width:100%}nav button{flex:1 1 auto;padding:0 12px}
 .kpis{grid-template-columns:1fr}
 .kpi span:last-child{font-size:24px}
 section.card{padding:20px 16px}
 .hand>button{padding:0 16px}.hand-body{padding:0 16px 20px}
 .compare{grid-template-columns:1fr}
 .line{flex-wrap:wrap}.line .lbl{width:100%}
 .row .who{width:100%}.row .act{min-width:0}
}
</style>
</head>
<body>
<div class="page">
 <header>
  <div>
   <a class="back" href="/">← Volver al juego</a>
   <h1>Evolución del entrenamiento</h1>
   <p class="sub" id="source">Cargando datos…</p>
  </div>
  <nav role="tablist" aria-label="Vista">
   <button type="button" role="tab" id="tab-p1" aria-controls="view" data-tab="p1" aria-selected="false">Fase 1 · Neuroevolución</button>
   <button type="button" role="tab" id="tab-p2" aria-controls="view" data-tab="p2" aria-selected="true">Fase 2 · Aprendizaje por refuerzo</button>
   <button type="button" role="tab" id="tab-cmp" aria-controls="view" data-tab="cmp" aria-selected="false">Comparación</button>
  </nav>
 </header>
 <main id="view" role="tabpanel" class="stack"></main>
</div>
<script>
'use strict';
const SVGNS = 'http://www.w3.org/2000/svg';
const POLL_MS = 5000;
const STOP_REASONS = { patience: 'paciencia', time_cap: 'el límite de tiempo', completed: 'las generaciones previstas' };
const OPPONENTS = { reactive: 'Reactivo', adaptive_utility: 'Utilidad adaptativa' };
const ACTIONS = { envido: 'Canta envido', real_envido: 'Canta real envido', falta_envido: 'Canta falta envido', truco: 'Canta truco', retruco: 'Canta retruco', vale_cuatro: 'Canta vale cuatro', quiero: 'Quiere', no_quiero: 'No quiere', fold: 'Se va al mazo' };
const SHORT = { envido: 'envido', real_envido: 'real envido', falta_envido: 'falta envido', truco: 'truco', retruco: 'retruco', vale_cuatro: 'vale cuatro', quiero: 'quiero', no_quiero: 'no quiero', fold: 'irse al mazo' };
const SUITS = { Espada: 'espadas', Oro: 'oros', Copa: 'copas', Basto: 'bastos' };

const state = {
  tab: 'p2',
  p1: { gens: [], ref: [], source: 'empty' },
  p2: { gens: [], ref: [], progress: { status: 'empty' } },
  open: { p1: false, p2: false },
  hand: { p2: null },
  loaded: false,
  failed: false,
};
let pollTimer = null;

/* ---------- pure helpers ---------- */
const num = (v) => typeof v === 'number' && Number.isFinite(v);
const pct = (v, digits = 1) => (v * 100).toFixed(digits).replace('.', ',') + ' %';
const signed = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ',');

function duration(seconds) {
  const minutes = Math.max(0, Math.round(seconds / 60));
  const h = Math.floor(minutes / 60), m = minutes % 60;
  return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`;
}

function cardName(card) {
  if (!Array.isArray(card)) return '?';
  const suit = SUITS[card[1]] || String(card[1]).toLowerCase();
  return `${card[0] === 1 ? 'ancho' : card[0]} de ${suit}`;
}

function cardIndex(action) {
  const m = /^card_(\d)$/.exec(action);
  return m ? Number(m[1]) : -1;
}

function actionLabel(action, hand) {
  const i = cardIndex(action);
  if (i >= 0) return `Juega ${hand && hand[i] ? 'el ' + cardName(hand[i]) : 'la carta ' + (i + 1)}`;
  return ACTIONS[action] || String(action).replaceAll('_', ' ');
}

function shortLabel(action, hand) {
  const i = cardIndex(action);
  if (i >= 0) return hand && hand[i] ? cardName(hand[i]) : `carta ${i + 1}`;
  return SHORT[action] || String(action).replaceAll('_', ' ');
}

/* Series of per-generation points for a phase chart. */
function seriesFor(phase, gens) {
  const rows = [];
  for (const g of gens) {
    if (phase === 'p2') {
      const c = g.check;
      if (!c || !num(c.gain)) continue;
      rows.push({ gen: g.generation, v: c.gain * 100, lo: num(c.lower_bound) ? c.lower_bound * 100 : c.gain * 100, hi: num(c.upper_bound) ? c.upper_bound * 100 : c.gain * 100, promoted: !!g.promoted, boundary: g.panel_boundary ? g.panel_boundary.to : null });
    } else {
      const c = g.promotion_check;
      if (!c || !num(c.win_rate)) continue;
      const e = num(c.margin_of_error) ? c.margin_of_error : 0;
      rows.push({ gen: g.generation, v: c.win_rate * 100, lo: (c.win_rate - e) * 100, hi: (c.win_rate + e) * 100, promoted: !!g.promoted, boundary: null });
    }
  }
  return rows;
}

function niceTicks(min, max, base) {
  const span = Math.max(max - min, 1);
  const steps = [1, 2, 5, 10, 20, 25, 50];
  const step = steps.find((s) => span / s <= 5) || 100;
  const start = Math.floor(min / step) * step, out = [];
  for (let t = start; t < max + step - 1e-9; t += step) out.push(t);
  if (!out.includes(base) && base >= out[0] && base <= out[out.length - 1]) out.push(base);
  return { ticks: out.sort((a, b) => a - b), lo: out[0], hi: out[out.length - 1] };
}

/* Phase 1 is training only when its log is the live run and the last generation did not end the phase. */
function phase1Training() {
  const last = state.p1.gens[state.p1.gens.length - 1];
  return state.p1.source === 'live' && !!last && !last.phase_ended;
}
const trainingNow = () => phase1Training() || state.p2.progress.status === 'training';

function summary(phase, gens, progress) {
  const last = gens[gens.length - 1];
  const promos = gens.filter((g) => g.promoted).length;
  let champion = null;
  if (phase === 'p2') {
    champion = num(progress.champion_generation) ? progress.champion_generation : (last && num(last.champion) ? last.champion : null);
  } else if (last) {
    champion = num(last.reigning_champion) ? last.reigning_champion : last.generation;
  }
  return { last, promos, champion, generation: last ? last.generation : 0 };
}

/* ---------- DOM helpers ---------- */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
  }
  n.append(...kids.filter((k) => k !== null && k !== undefined));
  return n;
}
function svg(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}
const legendItem = (cls, text) => el('span', {}, el('span', { class: cls }), text);

function chart(phase, rows) {
  const isP2 = phase === 'p2';
  const base = isP2 ? 0 : 50;
  const title = isP2 ? 'Mejora sobre la campeona contra el panel fijo' : 'Resultado del control contra la campeona';
  const rule = 'Asciende con +1 punto o más, margen por encima de cero y al menos 47,5 % de partidas ganadas cara a cara.';
  const note = isP2
    ? 'Puntos porcentuales por encima de la campeona vigente, con su margen. ' + (state.p2.gens.some((g) => g.measuring_only) ? 'Panel de medición provisorio: no cambia durante la corrida y sirve para medir, no para elegir la campeona final. ' : '') + rule
    : 'Porcentaje de partidas ganadas a la campeona vigente, con su margen. Asciende con 55 % o más.';
  const legend = el('div', { class: 'legend' }, legendItem('sw-line', 'por generación'), legendItem('sw-band', 'margen'), legendItem('sw-dot', 'ascenso'));
  if (isP2 && rows.some((r) => r.boundary !== null)) legend.append(legendItem('sw-dash', 'cambio de panel'));
  const measuring = isP2 && state.p2.gens.some((g) => g.measuring_only);
  const heading = el('div', { style: 'display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px' }, el('h2', { text: title }), measuring ? el('span', { class: 'pill', text: 'Panel de medición (provisorio)' }) : null);
  const box = el('section', { class: 'card', 'aria-label': title }, el('div', { class: 'head' }, heading, legend));
  if (!rows.length) {
    box.append(el('p', { class: 'empty', text: isP2 ? 'Todavía no hay controles de promoción. Aparecen desde la generación 2.' : 'Todavía no hay datos de entrenamiento.' }));
    box.append(el('p', { class: 'small', text: note }));
    return box;
  }
  const narrow = window.innerWidth < 640;
  const W = narrow ? 360 : 1000, H = narrow ? 280 : 320, L = narrow ? 58 : 64, R = W - (narrow ? 12 : 20), T = 20, B = H - 30;
  const F = narrow ? 13 : 13;
  const lowest = Math.min(base, ...rows.map((r) => r.lo)), highest = Math.max(base, ...rows.map((r) => r.hi));
  const { ticks, lo, hi } = niceTicks(lowest, highest, base);
  const gmin = rows[0].gen, gmax = rows[rows.length - 1].gen;
  const X = (g) => (gmax === gmin ? (L + R) / 2 : L + ((R - L) * (g - gmin)) / (gmax - gmin));
  const Y = (v) => T + ((B - T) * (hi - v)) / (hi - lo || 1);
  const unit = isP2 ? ' pts' : ' %';
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${title}, generaciones ${gmin} a ${gmax}` });
  for (const t of ticks) {
    s.append(svg('line', { x1: L, y1: Y(t), x2: R, y2: Y(t), stroke: t === base ? '#8A94A3' : '#EEF0F3', 'stroke-width': 1 }));
    s.append(svg('text', { x: L - 8, y: Y(t) + 4, 'text-anchor': 'end', 'font-size': F, fill: '#5A626E' }, (isP2 && t > 0 ? '+' : '') + t + unit));
  }
  for (const r of rows.filter((x) => x.boundary !== null)) {
    s.append(svg('line', { x1: X(r.gen), y1: T, x2: X(r.gen), y2: B, stroke: '#5A626E', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
    s.append(svg('text', { x: X(r.gen) + 5, y: T + 12, 'font-size': narrow ? 13 : 12, fill: '#3A414B' }, `panel v${r.boundary}`));
  }
  const up = rows.map((r) => `${X(r.gen).toFixed(1)},${Y(r.hi).toFixed(1)}`);
  const down = rows.map((r) => `${X(r.gen).toFixed(1)},${Y(r.lo).toFixed(1)}`).reverse();
  s.append(svg('path', { d: `M${up.join(' L')} L${down.join(' L')} Z`, fill: '#1F5FBF', 'fill-opacity': .12, stroke: 'none' }));
  s.append(svg('polyline', { points: rows.map((r) => `${X(r.gen).toFixed(1)},${Y(r.v).toFixed(1)}`).join(' '), fill: 'none', stroke: '#1F5FBF', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
  for (const r of rows.filter((x) => x.promoted)) {
    const c = svg('circle', { cx: X(r.gen), cy: Y(r.v), r: 6, fill: '#C2410C', stroke: '#FFFFFF', 'stroke-width': 2 });
    c.append(svg('title', {}, `Generación ${r.gen} · ascenso · ${isP2 ? signed(r.v) + ' pts' : r.v.toFixed(1).replace('.', ',') + ' %'}`));
    s.append(c);
  }
  s.append(svg('text', { x: L, y: H - 8, 'font-size': F, fill: '#5A626E' }, `gen ${gmin}`));
  s.append(svg('text', { x: R, y: H - 8, 'text-anchor': 'end', 'font-size': F, fill: '#5A626E' }, `gen ${gmax}`));
  box.append(s, el('p', { class: 'small', text: note }));
  return box;
}

function statusBlock(phase) {
  const p = state[phase];
  const gens = p.gens;
  const { generation, champion, last } = summary(phase, gens, phase === 'p2' ? p.progress : {});
  const champText = champion === null ? 'sin campeona todavía' : `campeona: generación ${champion}`;
  const prog = phase === 'p2' ? p.progress : { status: phase1Training() ? 'training' : (gens.length ? 'ended' : 'empty') };
  const wrap = el('div', { class: 'stack', style: 'gap:28px' });
  const none = !gens.length && prog.status === 'empty';
  let label, text, running = false;
  if (none) {
    label = 'Sin datos';
    text = phase === 'p2' ? 'Todavía no hay una ejecución de la fase 2.' : 'Todavía no hay una ejecución de la fase 1.';
  } else if (prog.status === 'training') {
    running = true; label = 'Entrenando';
    text = `Generación ${num(prog.generation) ? prog.generation + 1 : generation + 1} · ${champText}`;
  } else {
    label = 'Terminada';
    const reason = prog.stop_reason || (last && last.stop_reason) || null;
    const why = reason ? STOP_REASONS[reason] || reason : null;
    text = (why ? `Terminó por ${why} en la generación ${generation}` : `Terminó en la generación ${generation}`) + ` · ${champText}`;
  }
  wrap.append(el('div', { class: 'status' }, el('span', { class: 'pill' + (running ? ' on' : ''), text: label }), el('span', { style: 'color:#3A414B', text })));
  if (running && num(prog.elapsed) && num(prog.time_cap) && prog.time_cap > 0) {
    const share = Math.min(1, prog.elapsed / prog.time_cap);
    const end = new Date(Date.now() + Math.max(0, prog.time_cap - prog.elapsed) * 1000);
    const hhmm = end.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
    const bar = el('div', { class: 'bar' },
      el('div', { class: 'track', role: 'progressbar', 'aria-label': 'Tiempo de entrenamiento', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': Math.round(share * 100) }, el('div', { class: 'fill', style: `width:${(share * 100).toFixed(1)}%` })),
      el('p', { class: 'small', text: `${duration(prog.elapsed)} de ${duration(prog.time_cap)} · fin estimado ${hhmm}` }));
    wrap.append(bar);
  }
  return { wrap, running };
}

function kpis(phase) {
  const p = state[phase];
  const s = summary(phase, p.gens, phase === 'p2' ? p.progress : {});
  const third = phase === 'p2'
    ? ['Partidas por segundo', num(p.progress.matches_per_s) ? String(Math.round(p.progress.matches_per_s)) : '—']
    : ['Generaciones', s.generation ? String(s.generation) : '—'];
  const items = [['Campeona actual', s.champion === null ? '—' : `gen ${s.champion}`], ['Ascensos', String(s.promos)], third];
  return el('div', { class: 'kpis' }, ...items.map(([l, v]) => el('div', { class: 'card kpi' }, el('span', { text: l }), el('span', { text: v }))));
}

function handRows(steps, ownHand, otherHand, names) {
  return steps.map((d) => {
    const own = d.who === 0;
    const hand = own ? ownHand : otherHand;
    return el('div', { class: 'row' },
      el('span', { class: 'who', text: names[d.who] }),
      el('span', { class: 'act', text: actionLabel(d.action, hand) }),
      el('span', { class: 'why', text: d.why || '' }));
  });
}

function handView(phase) {
  const wrap = el('section', { class: 'card hand' });
  const open = state.open[phase];
  const btn = el('button', { type: 'button', 'aria-expanded': String(open), 'aria-controls': `hand-${phase}` }, el('span', { text: 'Ver una mano de ejemplo de la campeona' }), el('span', { text: open ? 'Ocultar' : 'Mostrar' }));
  btn.addEventListener('click', () => {
    state.open[phase] = !state.open[phase];
    if (state.open[phase] && phase === 'p2' && state.hand.p2 === null) loadHand();
    render();
  });
  wrap.append(btn);
  if (!open) return wrap;
  const body = el('div', { class: 'hand-body', id: `hand-${phase}` });
  if (phase === 'p1') {
    const rows = state.p1.gens;
    const champion = summary('p1', rows, {}).champion;
    const chosen = rows.find((g) => g.generation === champion && g.example_hand && g.example_hand.length);
    if (!chosen) body.append(el('p', { class: 'empty', text: 'No hay una mano de ejemplo registrada para la campeona vigente.' }));
    else {
      const hands = [0, 1].map((seat) => { const d = chosen.example_hand.find((x) => x.player === seat); return d && d.observation ? d.observation.hand : null; });
      body.append(el('p', { text: `Mano jugada por la campeona de la generación ${chosen.generation}.` }));
      body.append(...handRows(chosen.example_hand.map((d) => ({ who: d.player, action: d.action, why: d.bluff ? 'farol' : '' })), hands[0], hands[1], ['Jugador 1', 'Jugador 2']));
    }
  } else {
    const h = state.hand.p2;
    if (h === null) body.append(el('p', { class: 'empty', text: 'Cargando la mano…' }));
    else if (!h.available) body.append(el('p', { class: 'empty', text: h.reason === 'torch' ? 'No se puede mostrar la mano: falta PyTorch en este equipo.' : 'Disponible cuando la fase 2 tenga una campeona.' }));
    else {
      const mine = h.champion_hand.map((c) => [c.valor, c.palo]);
      const theirs = h.opponent_hand.map((c) => [c.valor, c.palo]);
      body.append(el('p', { text: `Cartas de la campeona: ${mine.map(cardName).join(', ')} · contra la ${h.opponent.charAt(0).toLowerCase() + h.opponent.slice(1)}.` }));
      body.append(...handRows(h.steps.map((s) => ({ who: s.by === 'champion' ? 0 : 1, action: s.action, why: s.top ? s.top.map((t) => `${Math.round(t.pct)} % ${shortLabel(t.action, mine)}`).join(' · ') : '' })), mine, theirs, ['Campeona', 'Rival']));
    }
  }
  wrap.append(body);
  return wrap;
}

function phaseView(phase) {
  const { wrap, running } = statusBlock(phase);
  wrap.append(kpis(phase), chart(phase, seriesFor(phase, state[phase].gens)), handView(phase));
  return { node: wrap, running };
}

/* ---------- comparison ---------- */
function latestByOpponent(rows, generation) {
  const out = {};
  const pool = generation === undefined ? rows : rows.filter((r) => r.generation === generation);
  for (const r of pool) {
    if (!r.reference_opponent || !num(r.win_rate)) continue;
    if (!out[r.reference_opponent] || r.generation >= out[r.reference_opponent].generation) out[r.reference_opponent] = r;
  }
  return out;
}

function comparison() {
  const box = el('section', { class: 'card' },
    el('div', { style: 'display:flex;flex-direction:column;gap:4px' },
      el('h2', { text: 'Neuroevolución vs Aprendizaje por refuerzo' }),
      el('p', { class: 'small', style: 'font-size:14px', text: 'Porcentaje de partidas ganadas contra los rivales de referencia. Compara los dos modos de red jugables: la fase 2 entrenó también contra redes de la fase 1, así que no muestra que el aprendizaje por refuerzo gane en general.' })));
  const p2 = latestByOpponent(state.p2.ref);
  if (!Object.keys(p2).length) {
    box.append(el('p', { class: 'empty', text: 'Disponible cuando la fase 2 tenga campeona evaluada.' }));
    return box;
  }
  const champion = summary('p1', state.p1.gens, {}).champion;
  let p1 = latestByOpponent(state.p1.ref, champion === null ? undefined : champion);
  if (!Object.keys(p1).length) p1 = latestByOpponent(state.p1.ref);
  const names = [...new Set([...Object.keys(p1), ...Object.keys(p2)])];
  const bar = (label, r, color) => el('div', { class: 'line' },
    el('span', { class: 'lbl', text: label }),
    el('div', { class: 'rail' }, el('div', { style: r ? `width:${Math.min(100, r.win_rate * 100)}%;background:${color}` : 'width:0' })),
    el('span', { class: 'val', text: r ? pct(r.win_rate) : '—' }));
  box.append(el('div', { class: 'compare' }, ...names.map((n) => el('div', { class: 'pair' },
    el('p', { text: `contra ${OPPONENTS[n] || n}` }),
    el('div', { style: 'display:flex;flex-direction:column;gap:10px' }, bar('Neuroevolución', p1[n], '#6B7482'), bar('Aprendizaje por refuerzo', p2[n], '#1F5FBF'))))));
  return box;
}

/* ---------- render / data ---------- */
function render() {
  document.querySelectorAll('nav button').forEach((b) => { const on = b.dataset.tab === state.tab; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  const view = document.getElementById('view');
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('main') ? document.activeElement.getAttribute('aria-controls') : null;
  view.setAttribute('aria-labelledby', 'tab-' + state.tab);
  let running = false;
  if (!state.loaded) view.replaceChildren(el('p', { class: 'empty', text: state.failed ? 'No se pudieron cargar los datos.' : 'Cargando datos…' }));
  else if (state.tab === 'cmp') view.replaceChildren(comparison());
  else { const v = phaseView(state.tab); running = v.running; view.replaceChildren(v.node); }
  if (focused) { const again = view.querySelector(`[aria-controls="${focused}"]`); if (again) again.focus(); }
  const src = document.getElementById('source');
  src.textContent = state.failed ? 'No se pudieron actualizar los datos; reintentando.' : (trainingNow() ? 'Actualización automática cada 5 segundos.' : 'Datos guardados del entrenamiento.');
}

async function getJson(url, fallback) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } catch (e) { state.failed = true; return fallback; }
}

async function loadHand() {
  state.hand.p2 = null;
  const h = await getJson('/evolucion/phase2/example-hand', { available: false, reason: 'error' });
  state.hand.p2 = h;
  render();
}

async function refreshPhase2() {
  state.failed = false;
  const [gens, ref, progress] = await Promise.all([
    getJson('/evolucion/phase2/generations', state.p2.gens),
    getJson('/evolucion/phase2/reference', state.p2.ref),
    getJson('/evolucion/phase2/progress', state.p2.progress)]);
  state.p2 = { gens, ref, progress };
}

async function refreshPhase1() {
  const [gens, ref, src] = await Promise.all([
    getJson('/evolucion/phase1/generations', state.p1.gens),
    getJson('/evolucion/phase1/reference', state.p1.ref),
    getJson('/evolucion/phase1/source', { source: state.p1.source })]);
  state.p1 = { gens, ref, source: src.source };
}

async function refreshAll() {
  state.failed = false;
  await refreshPhase1();
  await refreshPhase2();
  state.loaded = true;
  render();
  schedule();
}

function schedule() {
  clearTimeout(pollTimer);
  pollTimer = null;
  if (trainingNow()) pollTimer = setTimeout(poll, POLL_MS);
}

async function poll() {
  const before = `${state.p2.progress.status}|${state.p2.progress.champion_generation}`;
  state.failed = false;
  if (phase1Training()) await refreshPhase1();
  await refreshPhase2();
  const after = `${state.p2.progress.status}|${state.p2.progress.champion_generation}`;
  if (state.open.p2 && before !== after) loadHand();
  render();
  schedule();
}

document.querySelector('nav').addEventListener('keydown', (e) => {
  const order = ['p1', 'p2', 'cmp'];
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!step && e.key !== 'Home' && e.key !== 'End') return;
  e.preventDefault();
  const i = e.key === 'Home' ? 0 : e.key === 'End' ? order.length - 1 : (order.indexOf(state.tab) + step + order.length) % order.length;
  state.tab = order[i];
  render();
  document.getElementById('tab-' + state.tab).focus();
});
let lastNarrow = window.innerWidth < 640;
window.addEventListener('resize', () => { const n = window.innerWidth < 640; if (n !== lastNarrow) { lastNarrow = n; render(); } });
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); }));
refreshAll();
</script>
</body>
</html>
